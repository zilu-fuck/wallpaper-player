name: Release desktop or desktop and Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish-mobile-apk:
        description: "Joint release: require a verified signed Android APK before any release is published"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_INCLUDE_MOBILE: ${{ github.event_name == 'workflow_dispatch' && inputs['publish-mobile-apk'] == true && 'true' || 'false' }}

jobs:
  plan:
    name: Release preflight
    runs-on: windows-latest
    outputs:
      include-mobile: ${{ steps.plan.outputs.include-mobile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate tag, release mode and Android signing readiness
        id: plan
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: node scripts/release-gate.cjs plan

  verify:
    name: Full core and LAN verification
    needs: plan
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build verified Windows artifacts
    runs-on: windows-latest
    needs: [plan, verify]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build installers, portable app and plugins
        env:
          ELECTRON_PUBLISH: never
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Verify versions, update hashes and plugin integrity
        run: node scripts/release-gate.cjs windows .release/windows
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: .release/windows/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-mobile-apk:
    name: Build verified signed Android artifact
    runs-on: windows-latest
    needs: [plan, verify]
    if: ${{ needs.plan.outputs.include-mobile == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install root build tooling and generate shared contracts
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Root dependency installation failed" }
          npm run build:contracts
          if ($LASTEXITCODE -ne 0) { throw "Shared contracts generation failed" }
      - name: Install mobile dependencies and reviewed backports
        working-directory: mobile
        run: npm ci
      - name: Verify SDK compatibility and dependency consumers
        run: |
          Push-Location mobile
          try {
            node ../scripts/run-verify.cjs node_modules/expo/bin/cli install --check
            if ($LASTEXITCODE -ne 0) { throw "Expo SDK compatibility failed" }
          } finally { Pop-Location }
          npm run verify:dependency-security-mobile
          if ($LASTEXITCODE -ne 0) { throw "Mobile dependency security failed" }
      - name: Prepare required Android SDK
        shell: pwsh
        run: |
          if ($env:GITHUB_WORKSPACE -match '[^\x20-\x7e]') { throw "Native build workspace must use an ASCII path" }
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-37" "build-tools;37.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK preparation failed" }
      - name: Prebuild Android project
        working-directory: mobile
        env:
          CI: "1"
        run: node ../scripts/run-verify.cjs node_modules/expo/bin/cli prebuild --platform android --no-install
      - name: Build arm64 release APK
        working-directory: mobile/android
        run: ./gradlew.bat :app:assembleRelease --no-daemon --max-workers=2 "-PreactNativeArchitectures=arm64-v8a"
      - name: Sign using the reviewed release identity
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: node scripts/sign-release-apk.cjs
      - name: Verify actual APK signature, application version and ABI
        run: node scripts/release-gate.cjs android .release/android .release/signed/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: .release/android/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish only the complete verified candidate
    runs-on: windows-latest
    needs: [plan, verify, build-windows, build-mobile-apk]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.verify.result == 'success' && needs.build-windows.result == 'success' && (needs.plan.outputs.include-mobile == 'false' || needs.build-mobile-apk.result == 'success') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: .release/windows
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.include-mobile == 'true' }}
        with:
          name: release-android
          path: .release/android
          digest-mismatch: error
      - name: Recheck candidate, stage a draft and verify downloaded assets before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/release-publish.cjs
